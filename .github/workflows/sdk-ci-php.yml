name: SDK CI — PHP

on:
  pull_request:
    branches: [main]
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  scaffold-check:
    name: SDK Scaffold Check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Verify LICENSE file
        run: test -f LICENSE

  build-test:
    name: Build, test, TLS-bypass gate (PHP ${{ matrix.php }})
    # No event-name restriction: this job runs BOTH on a pull_request AND on
    # a tag push (vX.Y.Z) — the publish job below is gated behind it via
    # `needs:`, so a tag can only publish after validate/install/test/the
    # SC#4 TLS-bypass grep gate have all passed on that exact tagged commit.
    # With a matrix, `needs:` waits for EVERY leg, so a tag still cannot
    # publish unless the SDK passed on both ends of the supported range.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The gating matrix is floor + newest. The floor is the `php`
        # constraint in composer.json (8.2); the newest is the current release
        # (8.5, out 2025-11). 8.3 and 8.4 sit between two green legs.
        #
        # 8.2 reaches end of life on 2026-12-31. When it does, the floor moves
        # to 8.3 — composer.json and this list together, which
        # tests/VersionPolicyTest.php enforces.
        php: ['8.2', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # NOTE: shivammathur/setup-php has no pre-existing pin anywhere else in
      # this repository's workflows to reuse (unlike actions/checkout, which
      # is SHA-pinned repo-wide) and this environment has no GitHub network
      # egress to source a new commit SHA (RESEARCH.md environment
      # constraint). Using the major-version tag is a documented,
      # narrowly-scoped exception.
      # maintainer: repin to a commit SHA once GitHub network egress is
      # available in this environment.
      # The matrix floor and composer.json's `php` constraint are the same
      # number now. They were not always: the package declared `>=8.1` while
      # CI could only ever test 8.2, because the require-dev framework bridges
      # (illuminate/support ^11, symfony/* ^7) require PHP ^8.2 and
      # `composer install` was therefore unsatisfiable on 8.1. The declared
      # floor was untestable by construction. 8.1 reached end of life on
      # 2025-12-31, so raising the constraint to >=8.2 closes the gap without
      # dropping a version anyone should still be running.
      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2.37.2
        with:
          php-version: ${{ matrix.php }}
          # ffi backs the §23 OPAQUE client. It is installed even though CI has no
          # libaxiam_opaque_ffi to load: the tests drive the binding through a fake
          # OpaqueNativeInterface, but one of them exercises the REAL loader to
          # prove an absent library reports absent rather than throwing — and
          # without ext-ffi that test would take a different, shorter path and
          # stop checking what it is named for.
          #
          # gmp and bcmath are gone with SRP: they backed its modular
          # exponentiation and nothing else in this SDK uses them.
          extensions: sodium, ffi
          coverage: none

      # SC#5: composer validate + install + the full PHPUnit suite — SC#2
      # single-flight refresh (SingleFlightRefreshTest), CR-04 redaction
      # (SensitiveRedactionTest), the AMQP HMAC verify-before-handler matrix
      # (HmacVerifyTest), JWKS EdDSA verification (JwksVerifierTest), the
      # extension_loaded('grpc') REST-fallback proof
      # (AuthzDispatcherFallbackTest), and both framework-bridge tests
      # (LaravelMiddlewareTest, SymfonyAuthSubscriberTest).
      #
      # --strict (not --no-check-publish): this repository IS the Packagist
      # source, so the manifest must satisfy every publish-time requirement on
      # every PR — not just at tag time, when a failure would be too late.
      - name: composer validate (SC#5)
        if: matrix.php == '8.2'
        run: composer validate --strict

      - name: composer install
        run: composer install --no-interaction --prefer-dist

      - name: composer test (SC#5)
        run: composer test

      - name: Dependency vulnerability scan (CI-03)
        if: matrix.php == '8.2'
        run: composer audit --no-interaction

      # PHPStan level 6 (phpstan.neon.dist, excludes generated src/Grpc/Gen).
      - name: PHPStan level 6
        if: matrix.php == '8.2'
        run: vendor/bin/phpstan analyse --memory-limit=512M

      # Docblock-coverage gate. phpstan checks what a docblock SAYS but never that
      # one EXISTS, so without this the published API reference (phpDocumentor)
      # silently rots as new public methods land undocumented. Generated protobuf
      # stubs (src/Grpc/Gen) are excluded — see the script's header.
      - name: Docblock coverage (public API must be 100% documented)
        if: matrix.php == '8.2'
        run: php tools/docblock-coverage.php

      # The §27 examples are type-checked, not just syntax-checked. `php -l` proves a
      # file parses, which is worth very little for an example: an example's whole job is
      # to show the API being used correctly, and the ways it goes wrong — a renamed
      # method, a parameter that moved, an enum case that never existed — all parse
      # perfectly. Writing these four surfaced exactly that: a `listSigningCas($orgId,
      # $tenantId)` whose second parameter is really the page, a `Page` treated as an
      # array, and a `UserStatus::Suspended` the enum does not have.
      #
      # Scoped to these four rather than all of examples/: the Laravel and Symfony app
      # scaffolds reference framework globals that are not installed here, and making
      # them analysable is a separate change from adding a management surface.
      - name: PHPStan — §27 examples
        if: matrix.php == '8.2'
        run: |
          vendor/bin/phpstan analyse --level=6 --memory-limit=512M --no-progress \
            --autoload-file=vendor/autoload.php \
            examples/management_basics.php \
            examples/management_manifest.php \
            examples/management_manifest_attributes.php \
            examples/device_mtls_provisioning.php

      # D-12/SC#4: strict TLS is always on; the ONLY escape hatch is the
      # additive `customCa` CA-bundle-path pattern — there must be no Guzzle
      # `verify => false` (or equivalent TLS-verification-disable) surface
      # anywhere in the SDK's OWN source tree, including examples and tests.
      # `vendor/` is excluded — by this point in the job `composer install`
      # (above) has populated it with third-party dependency test/demo fixtures
      # (e.g. php-amqplib's SSLConnectionTest, Guzzle's own test suite) that
      # legitimately use `verify_peer`/`verify => false` in their OWN test
      # code; the gate's purpose is to police this SDK's shipped surface, not
      # third-party dependencies bundled for local development.
      - name: TLS-bypass gate — no TLS-bypass patterns (D-12/SC#4)
        if: matrix.php == '8.2'
        run: |
          set +e
          matches=$(grep -rn 'verify.*=>.*false' . --include=*.php --exclude-dir=vendor | grep -v customCa)
          set -e
          if [ -n "$matches" ]; then
            echo "::error::TLS-bypass gate failed — disallowed 'verify => false' usage found (only the additive customCa CA-bundle pattern is permitted):"
            echo "$matches"
            exit 1
          fi
          echo "TLS-bypass gate passed — no disallowed usage found."

  # R-2 (T-235): runs on BOTH triggers. It was `pull_request`-only, so a stale
  # §27 surface reaching a tag by any route other than `scripts/mass-tag.sh`
  # met no repository-side gate at all — and the version it shipped under can
  # never be reused.
  management-drift-check:
    name: §27 management surface drift-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # The §27 surface — 145 models, 24 namespace handles, and three generated test
      # suites — is produced by scripts/gen_management.py from the VENDORED
      # management-registry.json and openapi.json, and the output is committed so a
      # consumer never needs Python to build this package.
      #
      # Committed generated code is only trustworthy if something checks it is current.
      # The registry is maintained in ilpanich/axiam and re-vendored here; without this
      # gate, a re-vendor that adds an operation would leave the SDK silently shipping a
      # surface that disagrees with the contract it claims to implement — and every test
      # would still pass, because the tests are generated from the same stale copy.
      #
      # No PHP, no dependencies, and deliberately no setup-python: the generator imports
      # only the standard library, and ubuntu-latest ships a python3 new enough to run it.
      # Adding an action here would mean pinning one more third-party SHA for a step whose
      # entire job is `python3 file.py --check`.
      - name: Verify the committed §27 surface matches the vendored contract
        run: |
          python3 --version
          python3 scripts/gen_management.py --check

  protoc-drift-check:
    name: protoc drift-check (D-03)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2.37.2
        with:
          php-version: '8.2'
          coverage: none

      # PHP is the one AXIAM SDK that does not use buf (D-03) — protoc's PHP
      # generator is invoked directly by tools/grpc-gen.php, and the message
      # stubs it produces are committed to src/Grpc/Gen/ (README.md "Regenerating
      # the gRPC stubs"). Nothing before this gate ever compared those committed
      # stubs against the vendored proto/ tree they claim to be generated from —
      # that gap is exactly how CheckAccessResponse.reason_code (B1 deny-override,
      # contract 1.17) went missing from the committed stub while every other
      # artifact had already moved on to contract 1.19; it was found only by an
      # ad-hoc control run, not by CI. This job is that control run, made
      # permanent: regenerate from proto/ with the *exact* generator D-03 uses,
      # then diff the result against what is committed.
      #
      # protoc is downloaded pinned-by-checksum rather than installed via apt or
      # a floating GitHub Action, for the same reason buf.gen.yaml pins the Go
      # SDK's remote plugins (see that file's comment): protoc stamps its own
      # version into a comment header of every file it generates, so an
      # unpinned/floating protoc would produce false drift — a version-header-only
      # diff with no proto change behind it — the moment Ubuntu's apt mirror or a
      # GitHub Action rolls a new protoc release, on every open PR at once, for a
      # change nobody made. Pinning to one exact release, verified by its own
      # published sha256, is what keeps this gate's failures meaningful: a red
      # run means the PROTO changed and the stub did not follow, never "protoc
      # got upgraded underneath the gate".
      - name: Install pinned protoc (D-03)
        env:
          PROTOC_VERSION: '25.3'
          PROTOC_SHA256: 'f853e691868d0557425ea290bf7ba6384eef2fa9b04c323afab49a770ba9da80'
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          echo "${PROTOC_SHA256}  /tmp/protoc.zip" | sha256sum -c -
          mkdir -p /tmp/protoc
          unzip -q /tmp/protoc.zip -d /tmp/protoc
          echo "/tmp/protoc/bin" >> "$GITHUB_PATH"

      - name: Regenerate stubs from vendored proto/ (same generator as D-03)
        run: |
          set -euo pipefail
          protoc --version
          php tools/grpc-gen.php

      # This is the actual gate. `git diff --exit-code` both prints a real,
      # file-by-file unified diff of anything that changed AND exits non-zero if
      # it did — so a drifted stub fails the build with the diff attached to the
      # log, not just a pass/fail boolean. `build/` is gitignored scratch space
      # (tools/grpc-gen.php's own output before relocation) and never part of the
      # comparison.
      - name: Fail on drift — committed stubs must match proto/ (D-03)
        run: git diff --exit-code -- src/Grpc/Gen

  # Publishing to a public registry is IRREVERSIBLE — Packagist, like crates.io,
  # npm, PyPI, Maven Central and NuGet, refuses to re-use a version number. Git
  # tags are NOT branch-scoped, so without this gate a release tag cut on a
  # feature branch would ship unreviewed code to the world under a version that
  # can never be reclaimed. The publish job below `needs:` this.
  verify-tag-on-main:
    name: Verify tag is on main
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Assert the tagged commit is an ancestor of origin/main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is NOT on origin/main. Release tags must be cut from main."
            exit 1
          fi
          echo "OK: ${GITHUB_REF_NAME} (${GITHUB_SHA}) is on origin/main."

  publish:
    name: Publish to Packagist
    # Manual-on-tag job: only runs when a maintainer pushes a vX.Y.Z tag, and
    # only after build-test (validate/install/test/PHPStan/TLS-gate) has passed
    # on that exact tagged commit.
    #
    # There is NO push step and NO secret here, by design. Packagist does not
    # accept an upload — it PULLS. This repository is registered on Packagist as
    # the source of `axiam/axiam-sdk`, and Packagist's GitHub webhook fires on
    # the tag push, at which point Packagist reads composer.json at the tag and
    # derives the version from the tag name itself. (That is also why
    # composer.json carries no `version` field: a hardcoded one would override
    # the tag and publish every release as the same version.)
    #
    # This job's remaining job is therefore to be the last gate before that
    # webhook's effect becomes permanent: assert the manifest is publishable.
    #
    # T-148 / H-1: no build-provenance attestation here, and that is not an
    # omission — it follows from the PULL model above. There is no artifact:
    # Composer fetches the source from this repository (or a dist zip GitHub
    # generates from the same tag), so there are no bytes an attestation could
    # speak for. `composer.lock` records the resolved commit hash, which is
    # what makes a rewritten tag visible to a consumer.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build-test, management-drift-check, verify-tag-on-main]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2.37.2
        with:
          php-version: '8.2'
          # ffi backs the §23 OPAQUE client. It is installed even though CI has no
          # libaxiam_opaque_ffi to load: the tests drive the binding through a fake
          # OpaqueNativeInterface, but one of them exercises the REAL loader to
          # prove an absent library reports absent rather than throwing — and
          # without ext-ffi that test would take a different, shorter path and
          # stop checking what it is named for.
          #
          # gmp and bcmath are gone with SRP: they backed its modular
          # exponentiation and nothing else in this SDK uses them.
          extensions: sodium, ffi
          coverage: none

      - name: composer validate --strict (manifest must be publishable)
        run: composer validate --strict

      # D-03: the committed src/Grpc/Gen stubs must be up to date before a
      # release tag is trusted — same drift-check as the PR gate (protoc-drift-
      # check), run again here as a belt-and-suspenders confirm on the tagged
      # commit itself, since protoc-drift-check only runs `on: pull_request` and
      # this job runs on a tag push instead.
      - name: Install pinned protoc (D-03)
        env:
          PROTOC_VERSION: '25.3'
          PROTOC_SHA256: 'f853e691868d0557425ea290bf7ba6384eef2fa9b04c323afab49a770ba9da80'
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          echo "${PROTOC_SHA256}  /tmp/protoc.zip" | sha256sum -c -
          mkdir -p /tmp/protoc
          unzip -q /tmp/protoc.zip -d /tmp/protoc
          echo "/tmp/protoc/bin" >> "$GITHUB_PATH"

      - name: Regenerate stubs from vendored proto/ (same generator as D-03)
        run: php tools/grpc-gen.php

      - name: Fail on drift — committed stubs must match proto/ (D-03)
        run: git diff --exit-code -- src/Grpc/Gen

      - name: Packagist picks up the tag via its GitHub webhook
        run: |
          set -euo pipefail
          echo "Tag ${GITHUB_REF_NAME} is on main and build-test passed on ${GITHUB_SHA}."
          echo "Packagist auto-updates https://packagist.org/packages/axiam/axiam-sdk from this"
          echo "repository's registered GitHub webhook — no push, no API key, no secret is needed."
          echo "If the release does not appear within a few minutes, check that the repository is"
          echo "submitted on packagist.org and that Settings -> Webhooks shows a green delivery."
